<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Conexão do WhatsApp | Auron Conversões</title>
  <style>
    :root{--purple:#541285;--bg:#f6f5f8;--card:#fff;--text:#17151a;--muted:#716b78;--border:#e8e4eb;--green:#16794b;--red:#b42318}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(560px,100%);background:var(--card);border:1px solid var(--border);border-radius:18px;padding:30px;box-shadow:0 18px 60px rgba(0,0,0,.08)}.brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:18px;margin-bottom:24px}.mark{width:36px;height:36px;border-radius:10px;background:var(--purple);color:#fff;display:grid;place-items:center;font-weight:900}h1{font-size:26px;margin:0 0 10px}p{color:var(--muted);line-height:1.55;margin:0 0 18px}.status{border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-top:18px}.ok{color:var(--green)}.error{color:var(--red)}.small{font-size:13px}.btn{display:inline-block;margin-top:8px;background:var(--purple);color:#fff;text-decoration:none;padding:11px 15px;border-radius:10px;font-weight:700}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><div class="mark">A</div>Auron Conversões</div>
    <h1 id="title">Conexão do WhatsApp</h1>
    <p id="message">Recebemos o retorno da Meta. Você pode fechar esta janela e voltar ao processo de configuração.</p>
    <div id="status" class="status small">Validando retorno...</div>
    <a class="btn" href="/painel">Voltar ao painel</a>
  </main>
  <script>
    const params=new URLSearchParams(location.search);
    const status=document.getElementById('status');
    const title=document.getElementById('title');
    const message=document.getElementById('message');
    const error=params.get('error');
    const errorDescription=params.get('error_description');
    const code=params.get('code');
    if(error){
      title.textContent='Conexão não concluída';
      message.textContent='A Meta retornou um erro durante o cadastro. Volte ao processo e tente novamente.';
      status.classList.add('error');
      status.textContent=errorDescription||error;
    }else if(code){
      title.textContent='Retorno recebido';
      message.textContent='A autorização foi concluída na Meta e o retorno chegou ao Auron Conversões. Continue a configuração no painel da Meta.';
      status.classList.add('ok');
      status.textContent='Autorização recebida com sucesso.';
    }else{
      status.textContent='Página de retorno pronta para o Cadastro Incorporado da Meta.';
    }
  </script>
</body>
</html>
