<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dataset da WABA | Auron Conversões</title>
  <style>
    :root{--purple:#541285;--purple2:#6e24a5;--bg:#f6f5f8;--card:#fff;--text:#17151a;--muted:#716b78;--border:#e8e4eb;--green:#16794b;--red:#b42318;--light:#f1edf4}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(620px,100%);background:var(--card);border:1px solid var(--border);border-radius:18px;padding:28px;box-shadow:0 18px 60px rgba(0,0,0,.08)}h1{margin:0 0 8px;font-size:26px}p{margin:0 0 18px;color:var(--muted);line-height:1.5}label{display:block;font-weight:700;margin:14px 0 7px}input{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;font:inherit}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.btn{border:0;border-radius:10px;padding:12px 15px;font-weight:800;cursor:pointer}.btn-primary{background:var(--purple);color:#fff}.btn-primary:hover{background:var(--purple2)}.btn-light{background:var(--light);color:var(--purple)}.btn:disabled{opacity:.6;cursor:not-allowed}.result{margin-top:18px;border:1px solid var(--border);border-radius:12px;padding:14px;white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,Consolas,monospace;font-size:13px;min-height:54px}.ok{color:var(--green)}.error{color:var(--red)}.note{font-size:13px;color:var(--muted);margin-top:12px}@media(max-width:560px){.actions{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="card">
    <h1>Dataset da WABA</h1>
    <p>Consulte o dataset da conta real da Auron ou crie um caso ainda não exista. Criar o dataset não envia lead, compra ou qualquer evento para a Meta.</p>
    <label for="waba">WABA ID</label>
    <input id="waba" value="1410072020758429" inputmode="numeric">
    <label for="password">Senha do painel</label>
    <input id="password" type="password" autocomplete="current-password">
    <div class="actions">
      <button id="check" class="btn btn-light">Consultar dataset</button>
      <button id="create" class="btn btn-primary">Criar dataset</button>
    </div>
    <div class="note">Se já existir um dataset, o botão de criação apenas retorna o existente e não cria duplicado.</div>
    <div id="result" class="result">Aguardando ação...</div>
  </main>
<script>
const result=document.getElementById('result');
const check=document.getElementById('check');
const create=document.getElementById('create');

function headers(){
  return {
    'Content-Type':'application/json',
    'x-auron-key':document.getElementById('password').value
  };
}

function payload(){
  return JSON.stringify({waba_id:document.getElementById('waba').value.trim()});
}

async function run(url,loading){
  result.className='result';
  result.textContent=loading;
  check.disabled=true;
  create.disabled=true;
  try{
    const res=await fetch(url,{method:'POST',headers:headers(),body:payload()});
    const data=await res.json();
    result.classList.add(data.ok?'ok':'error');
    result.textContent=JSON.stringify(data,null,2);
  }catch(e){
    result.classList.add('error');
    result.textContent=e.message||String(e);
  }finally{
    check.disabled=false;
    create.disabled=false;
  }
}

check.onclick=()=>run('/api/waba-dataset','Consultando a Meta...');
create.onclick=()=>run('/api/waba-dataset-create','Criando dataset na Meta...');
</script>
</body>
</html>
