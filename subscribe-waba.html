<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Inscrever WABA | Auron Conversões</title>
  <style>
    :root{--purple:#541285;--bg:#f6f5f8;--card:#fff;--text:#17151a;--muted:#716b78;--border:#e8e4eb;--green:#16794b;--red:#b42318}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(520px,100%);background:var(--card);border:1px solid var(--border);border-radius:18px;padding:30px;box-shadow:0 18px 60px rgba(0,0,0,.08)}.brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:18px;margin-bottom:24px}.mark{width:36px;height:36px;border-radius:10px;background:var(--purple);color:#fff;display:grid;place-items:center;font-weight:900}h1{font-size:25px;margin:0 0 8px}p{color:var(--muted);line-height:1.5;margin:0 0 20px}label{display:block;font-weight:700;font-size:13px;margin:14px 0 6px}input{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;outline:none}input:focus{border-color:#b89acb}.btn{width:100%;margin-top:18px;border:0;border-radius:10px;padding:12px 15px;background:var(--purple);color:#fff;font-weight:800;cursor:pointer}.btn:disabled{opacity:.55;cursor:not-allowed}.status{border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-top:18px;white-space:pre-wrap;word-break:break-word;font-size:13px}.ok{color:var(--green)}.error{color:var(--red)}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><div class="mark">A</div>Auron Conversões</div>
    <h1>Inscrever WhatsApp real</h1>
    <p>Inscreve o app Auron Conversões nos webhooks da WABA informada.</p>

    <label for="waba">WABA ID</label>
    <input id="waba" value="1410072020758429" inputmode="numeric" autocomplete="off">

    <label for="password">Senha do painel</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="Senha interna do Auron Conversões">

    <button id="submit" class="btn">Inscrever Auron Conversões</button>
    <div id="status" class="status">Aguardando.</div>
  </main>
<script>
const button=document.getElementById('submit');
const status=document.getElementById('status');
button.onclick=async()=>{
  const waba=document.getElementById('waba').value.trim();
  const password=document.getElementById('password').value;
  status.className='status';
  status.textContent='Enviando solicitação para a Meta...';
  button.disabled=true;
  try{
    const res=await fetch('/api/waba-subscription',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-auron-key':password},
      body:JSON.stringify({waba_id:waba})
    });
    const data=await res.json();
    if(!res.ok||!data.ok){
      const details=data?.meta?.error?.message;
      throw new Error(details||data.error||'Falha ao inscrever WABA');
    }
    status.className='status ok';
    status.textContent=`Sucesso. WABA ${data.waba_id} inscrita no Auron Conversões.\n\nResposta da Meta: ${JSON.stringify(data.subscribed)}`;
  }catch(error){
    status.className='status error';
    status.textContent=`Erro: ${error.message}`;
  }finally{
    button.disabled=false;
  }
};
</script>
</body>
</html>
